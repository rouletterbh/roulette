<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="RBL">
  <!-- Roblette (RBL) monogram: ink on canvas, drawn in the site's own design system. No third-party marks. -->
  <circle cx="32" cy="32" r="31" fill="#f7f7f2"/>
  <circle cx="32" cy="32" r="30" fill="none" stroke="#080a08" stroke-width="2"/>
  <!-- "R": stem, bowl and leg as one stroked path -->
  <path d="M23 46 V18 H33 a7 7 0 0 1 0 14 H23 M31 32 L41 46" fill="none" stroke="#080a08" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- roulette pocket dot -->
  <circle cx="44" cy="20" r="3" fill="#080a08"/>
</svg>
